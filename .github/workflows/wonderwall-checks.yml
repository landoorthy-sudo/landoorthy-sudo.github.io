name: Check Wonderwall
on:
  pull_request:
    paths:
      - 'static/wonderwall/**'
      - 'tests/wonderwall.test.mjs'
      - 'hugo.toml'
      - 'content/tools/wonderwall.md'
      - '.github/workflows/wonderwall-checks.yml'
  push:
    paths:
      - 'hugo.toml'
      - 'content/tools/wonderwall.md'
      - 'static/wonderwall/**'
      - 'tests/wonderwall.test.mjs'
      - '.github/workflows/wonderwall-checks.yml'
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check syntax and reward calculations
        run: |
          node --check static/wonderwall/app.mjs
          node --test tests/wonderwall.test.mjs
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true
      - name: Verify Hugo integration
        run: |
          hugo --minify --destination /tmp/wonderwall-public
          test -f /tmp/wonderwall-public/wonderwall/index.html
          test -f /tmp/wonderwall-public/wonderwall/core.mjs
          grep -q 'href=/wonderwall/' /tmp/wonderwall-public/tools/index.html
          grep -q '写文会爆金币' /tmp/wonderwall-public/tools/index.html
