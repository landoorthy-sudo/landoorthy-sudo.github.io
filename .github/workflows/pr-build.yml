name: Check site build
on:
  pull_request:
  push:
    branches-ignore: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: peaceiris/actions-hugo@v3
        with:
          hugo-version: '0.147.9'
          extended: true
      - name: Build
        run: hugo --minify --panicOnWarning=false
      - name: Check key pages exist
        run: |
          grep -q pixel-room public/index.html
          for p in index.html desk/index.html shelf/index.html about/index.html notes/index.html; do test -f "public/$p" || { echo "missing $p"; exit 1; }; done
      - uses: actions/upload-artifact@v4
        with:
          name: site-preview
          path: public
          retention-days: 3
