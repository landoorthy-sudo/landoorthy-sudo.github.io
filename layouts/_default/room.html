{{ define "content" }}
<article class="blog-single room-page">
  <header class="blog-title">
    {{ with .Params.furniture }}<p class="room-sign">{{ . }}</p>{{ end }}
    <h1>{{ .Title }}</h1>
    {{ with .Description }}<p class="room-lede">{{ . }}</p>{{ end }}
  </header>
  <section class="blog-content">{{ .Content }}</section>
  <p class="room-back"><a href="{{ "/" | relURL }}">← 回到房间</a></p>
</article>
{{ end }}
