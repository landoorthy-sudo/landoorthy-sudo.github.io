<div class="home cat-room">
    <div class="info">
        <div class="intro">
            <p class="room-sign">Landoorthy 与丝瓜的房间</p>
            <h1>{{ .Site.Params.author }}</h1>
            <small>{{ .Site.Params.authorDescription | markdownify }}</small>
            <p>{{ .Site.Params.info | markdownify }}</p>
        </div>

        {{ with .Site.Params.avatarURL }}
        <div class="avatar">
            <img src="{{ . | relURL }}" alt="丝瓜，一只银色的小猫">
            <span class="cat-name">丝瓜 · 房间主人</span>
        </div>
        {{ end }}
    </div>

    <section class="room" aria-label="房间里的家具">
        {{ range .Site.Data.room }}
        <a class="furniture" href="{{ .url | relURL }}">
            <span class="furniture-icon" aria-hidden="true">{{ .icon }}</span>
            <span class="furniture-name">{{ .name }}</span>
            <span class="furniture-what">{{ .what }}</span>
            <span class="furniture-note">{{ .note }}</span>
        </a>
        {{ end }}
    </section>
</div>
